version: '3.8'

services:
  # ===========================================
  # Infrastructure Services
  # ===========================================

  postgres-test:
    image: postgres:15-alpine
    container_name: banking-recon-postgres-test
    environment:
      POSTGRES_DB: banking_recon_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_123
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-recon-test-network

  redis-test:
    image: redis:7-alpine
    container_name: banking-recon-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-recon-test-network

  minio-test:
    image: minio/minio:latest
    container_name: banking-recon-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-recon-test-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: banking-recon-mailhog-test
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - banking-recon-test-network

  # ===========================================
  # Core Backend Services
  # ===========================================

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        SERVICE_NAME: auth-service
    container_name: banking-recon-auth-service-test
    env_file:
      - .env.test
    environment:
      AUTH_SERVICE_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - banking-recon-test-network
    volumes:
      - ./apps/auth-service:/app/apps/auth-service
      - ./libs:/app/libs
      - /app/node_modules
    command: npm run start:dev -- auth-service

  data-prep-service:
