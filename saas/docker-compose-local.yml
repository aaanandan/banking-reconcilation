# docker-compose.yml - LOCAL DEVELOPMENT SETUP

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════
  postgres:
    image: postgres:15
    container_name: banking-recon-db
    environment:
      POSTGRES_DB: banking_recon_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════
  # REDIS (for caching)
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: banking-recon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════════════════════
  # MINIO (S3-compatible local storage)
  # ═══════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: banking-recon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ═══════════════════════════════════════════════════════
  # BACKEND SERVICES (All 22 services)
  # ═══════════════════════════════════════════════════════
  
  # Data Prep Service
  data-prep-service:
    build:
      context: .
      dockerfile: apps/data-prep-service/Dockerfile
    container_name: data-prep-service
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/banking_recon_dev
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: uploads
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/data-prep-service:/app/apps/data-prep-service
      - /app/node_modules
    command: npm run start:dev

  # State Manager Service
  state-manager-service:
    build:
      context: .
      dockerfile: apps/state-manager-service/Dockerfile
    container_name: state-manager-service
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/banking_recon_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/state-manager-service:/app/apps/state-manager-service
      - /app/node_modules
    command: npm run start:dev

  # Match Orchestrator
  match-orchestrator:
    build:
      context: .
      dockerfile: apps/match-orchestrator/Dockerfile
    container_name: match-orchestrator
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/banking_recon_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/match-orchestrator:/app/apps/match-orchestrator
      - /app/node_modules
    command: npm run start:dev

  # Learning Service
  learning-service:
    build:
      context: .
      dockerfile: apps/learning-service/Dockerfile
    container_name: learning-service
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/banking_recon_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/learning-service:/app/apps/learning-service
      - /app/node_modules
    command: npm run start:dev

  # Question Manager Service
  question-manager-service:
    build:
      context: .
      dockerfile: apps/question-manager-service/Dockerfile
    container_name: question-manager-service
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/banking_recon_dev
      NODE_ENV: development
    ports:
      - "3003:3003"
    depends_on:
      - postgres
    volumes:
      - ./apps/question-manager-service:/app/apps/question-manager-service
      - /app/node_modules
    command: npm run start:dev

  # MT-01 through MT-16 (Pattern - add all 16)
  mt-01:
    build:
      context: .
      dockerfile: apps/mt-01/Dockerfile
    container_name: mt-01
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/banking_recon_dev
      NODE_ENV: development
    ports:
      - "3101:3101"
    depends_on:
      - postgres
    volumes:
      - ./apps/mt-01:/app/apps/mt-01
      - /app/node_modules
    command: npm run start:dev

  # ... (repeat for mt-02 through mt-16 with ports 3102-3116)

  # ═══════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════
  frontend:
    build:
      context: ./banking-recon-frontend
      dockerfile: Dockerfile.dev
    container_name: banking-recon-frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_STRIPE_KEY: pk_test_xxxxx
    ports:
      - "5173:5173"
    volumes:
      - ./banking-recon-frontend:/app
      - /app/node_modules
    command: npm run dev

  # ═══════════════════════════════════════════════════════
  # MONITORING (Optional)
  # ═══════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: banking-recon-network
