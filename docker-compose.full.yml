version: '3.8'

# Full Docker Compose deployment for Banking Reconciliation Platform
# This runs ALL services (backend, frontend, monitoring) in containers
#
# Usage:
#   docker-compose -f docker-compose.full.yml up -d
#
# Services: 30+ containers (23 backend + frontend + monitoring stack)

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking_reconciliation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND SERVICES (NestJS Microservices)
  # ═══════════════════════════════════════════════════════════════════════════

  # Auth Service - Port 3001
  auth-service:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: banking-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-banking_reconciliation}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - AUTH_SERVICE_PORT=3001
      - HEALTH_CHECK_PORT=3001
      - PROMETHEUS_PORT=9091
      # ALLOWED_ORIGINS must be set explicitly - the code's hardcoded fallback
      # does NOT include :5173, so the frontend container gets CORS errors
      # without this (see HANDOVER_GUIDE.md CORS section).
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:4200,http://localhost:5173,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      # auth-service has no public unauthenticated /health route (the only one,
      # /admin/health, requires JWT+AdminGuard) - just check the port is open.
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(3001,'localhost');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Prep Service - Port 3003
  data-prep-service:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: data-prep-service
    container_name: banking-data-prep-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-banking_reconciliation}
      - DATA_PREP_SERVICE_PORT=3003
      - HEALTH_CHECK_PORT=3003
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/data-prep/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Match Orchestrator - Port 3004
  match-orchestrator:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: match-orchestrator
    container_name: banking-match-orchestrator
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-banking_reconciliation}
      - ORCHESTRATOR_PORT=3004
      - HEALTH_CHECK_PORT=3004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/orchestrate/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # State Manager Service - Port 3005
  # ⚠️ KNOWN ISSUE: app code hardcodes app.listen(3002), ignores STATE_MANAGER_PORT
  # entirely. This service's container will NOT be reachable on the 3005 mapping
  # below until apps/state-manager-service/src/main.ts is fixed to read the env
  # var (same pattern as match-orchestrator above). See HANDOVER_GUIDE.md.
  state-manager-service:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: state-manager-service
    container_name: banking-state-manager
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-banking_reconciliation}
      - STATE_MANAGER_PORT=3005
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # Learning Service - Port 3006
  learning-service:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: learning-service
    container_name: banking-learning-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-banking_reconciliation}
      - LEARNING_SERVICE_PORT=3006
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # Question Manager Service - Port 3007
  question-manager-service:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: question-manager-service
    container_name: banking-question-manager
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-banking_reconciliation}
      - QUESTION_MANAGER_PORT=3007
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # MT-01: Exact Match Service - Port 3010
  mt-01-exact-match:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: mt-01-exact-match
    container_name: banking-mt-01
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_PORT=3010
    networks:
      - banking-network
    restart: unless-stopped

  # MT-02: Near-Exact Match Service - Port 3011
  mt-02-near-exact:
    build:
      context: ./banking-reconciliation-system
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: mt-02-near-exact
    container_name: banking-mt-02
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_PORT=3011
    networks:
      - banking-network
    restart: unless-stopped

  # Add MT-03 through MT-16 similarly (ports 3012-3025)
  # Abbreviated for brevity - same pattern as above

  # ═══════════════════════════════════════════════════════════════════════════
  # BILLING SERVICE
  # ═══════════════════════════════════════════════════════════════════════════

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: banking-billing-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PORT=3002
    networks:
      - banking-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./banking-recon-frontend
      dockerfile: Dockerfile
      target: production
      # Vite bakes these into the static bundle at BUILD time - setting them
      # under `environment:` below (the old way this file did it) has zero
      # effect since this is a static Nginx-served build with no Node process
      # reading env vars at runtime. Must be build args. Names must match what
      # src/api/client.ts actually reads: VITE_API_URL, VITE_DATA_PREP_URL.
      args:
        VITE_API_URL: http://localhost:3001
        VITE_DATA_PREP_URL: http://localhost:3003
    container_name: banking-frontend
    ports:
      - "5173:80"
    networks:
      - banking-network
    depends_on:
      - auth-service
      - data-prep-service
      - match-orchestrator
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MONITORING STACK
  # ═══════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: banking-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks:
      - banking-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: banking-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - banking-network
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: banking-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - banking-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: banking-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - banking-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: banking-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - banking-network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: banking-logstash
    ports:
      - "5000:5000"
      - "5044:5044"
    volumes:
      - ./monitoring/elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - banking-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: banking-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - banking-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  elasticsearch_data:
  uploads:

# ═══════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════

networks:
  banking-network:
    driver: bridge
