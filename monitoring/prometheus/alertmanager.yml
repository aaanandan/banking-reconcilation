# Alertmanager Configuration for Banking Reconciliation Platform
# Step 225: Setup Alert Rules

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 12h

    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 24h

    - match:
        category: security
      receiver: 'security-alerts'
      group_wait: 10s
      repeat_interval: 30m

    - match:
        category: business
      receiver: 'business-alerts'
      group_wait: 2m
      repeat_interval: 6h

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '^(High|Slow|Low).*'
    equal: ['service']

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    # Slack configured in Step 226
    # slack_configs:
    #   - channel: '#alerts-critical'
    #     title: 'CRITICAL: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  - name: 'warning-alerts'
    # slack_configs:
    #   - channel: '#alerts-warning'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  - name: 'info-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  - name: 'security-alerts'
    # slack_configs:
    #   - channel: '#security-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  - name: 'business-alerts'
    # slack_configs:
    #   - channel: '#business-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true
