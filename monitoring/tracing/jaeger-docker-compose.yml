# Step 231: Jaeger Distributed Tracing — standalone compose snippet
# Merge into main docker-compose.yml or run separately:
#   docker compose -f jaeger-docker-compose.yml up -d

version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: banking-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    ports:
      - "5775:5775/udp"   # Zipkin/Thrift compact
      - "6831:6831/udp"   # Jaeger Thrift compact
      - "6832:6832/udp"   # Jaeger Thrift binary
      - "5778:5778"       # Config server
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # HTTP collector (used by tracer.js)
      - "14250:14250"     # gRPC collector
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  banking-network:
    external: true
    name: banking-reconcilation_banking-network
