# Logstash Pipeline for Banking Reconciliation Platform
# Step 227: Deploy ELK Stack
# Step 228: Log forwarding from all services

input {
  # Filebeat input — receives logs forwarded from services (Step 228)
  beats {
    port => 5044
    type => "service-logs"
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
    type => "direct-logs"
  }

  # UDP input for syslog
  udp {
    port => 5001
    codec => json
    type => "syslog"
  }
}

filter {
  # Parse JSON log messages from NestJS services
  if [type] == "service-logs" or [type] == "direct-logs" {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    # Promote parsed fields to top level if JSON parsing succeeded
    if [parsed] {
      mutate {
        rename => {
          "[parsed][level]"     => "log_level"
          "[parsed][message]"   => "log_message"
          "[parsed][context]"   => "log_context"
          "[parsed][timestamp]" => "log_timestamp"
          "[parsed][tenantId]"  => "tenant_id"
          "[parsed][userId]"    => "user_id"
          "[parsed][requestId]" => "request_id"
          "[parsed][service]"   => "service_name"
        }
        remove_field => ["parsed"]
      }
    }
  }

  # Add environment metadata
  mutate {
    add_field => {
      "environment"   => "${NODE_ENV:development}"
      "platform"      => "banking-reconciliation"
    }
  }

  # Route to correct index by service
  if [fields][service] {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "logs-%{[fields][service]}-%{+YYYY.MM.dd}"
      }
    }
  } else if [service_name] {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "logs-%{service_name}-%{+YYYY.MM.dd}"
      }
    }
  } else {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "logs-general-%{+YYYY.MM.dd}"
      }
    }
  }

  # Parse timestamp if present
  if [log_timestamp] {
    date {
      match => ["log_timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Drop health check noise
  if [log_message] =~ /health|ping|favicon/ {
    drop {}
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts            => ["elasticsearch:9200"]
    index            => "%{[@metadata][target_index]}"
    manage_template  => true
    template_name    => "banking-logs"
    template_overwrite => true
  }

  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}
